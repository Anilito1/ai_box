<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title></title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar">
        <div class="brand"><img class="brand-logo" id="brand-logo" alt="" /><span id="brand-name"></span></div>
        <button class="title-btn" id="open-settings" data-i18n-title="side.settings">
          <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="2.2" />
            <path
              d="M8 1.8v1.6M8 12.6v1.6M14.2 8h-1.6M3.4 8H1.8M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1M12.4 12.4l-1.1-1.1M4.7 4.7L3.6 3.6M8 4.6a3.4 3.4 0 1 0 0 6.8a3.4 3.4 0 1 0 0-6.8"
            />
          </svg>
        </button>
      </header>

      <aside class="sidebar">
        <div class="side-section">
          <div class="side-label" data-i18n="side.master"></div>
          <div id="master-slot"></div>
        </div>
        <div class="side-section side-workers">
          <div class="side-label"><span data-i18n="side.workers"></span> <span id="worker-count"></span></div>
          <div class="worker-list">
            <div class="card-list" id="active-list"></div>
            <p class="side-empty" id="worker-empty" data-i18n="side.noWorker"></p>
            <details class="side-closed" id="closed-group" hidden>
              <summary><span data-i18n="side.closed"></span><span id="closed-count"></span></summary>
              <div class="card-list" id="closed-list"></div>
            </details>
          </div>
        </div>
        <div class="side-repos" id="repos"></div>
        <p class="side-empty side-repos-empty" id="repos-empty" data-i18n="side.noRepo" hidden></p>
      </aside>

      <main class="workspace" id="workspace">
        <section class="pane pane-master" id="pane-master"></section>
        <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"></div>
        <section class="pane pane-worker" id="pane-worker"></section>
      </main>

      <footer class="statusbar">
        <div class="sb-group" id="sb-left"></div>
        <div class="sb-group" id="sb-right"></div>
      </footer>
    </div>
    <div class="menu" id="menu" hidden></div>
    <div class="setup" id="setup" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
