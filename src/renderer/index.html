<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <title>Claude Hub</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar">
        <div class="brand"><img class="brand-logo" src="logo.png" alt="" />Claude Hub</div>
      </header>

      <aside class="sidebar">
        <div class="side-section">
          <div class="side-label">Maître</div>
          <div id="master-slot"></div>
        </div>
        <div class="side-section side-workers">
          <div class="side-label">Workers <span id="worker-count"></span></div>
          <div class="worker-list">
            <div class="card-list" id="active-list"></div>
            <p class="side-empty" id="worker-empty">Aucun worker actif.<br />Demande au maître de lancer une mission.</p>
            <details class="side-closed" id="closed-group" hidden>
              <summary><span>Terminés</span><span id="closed-count"></span></summary>
              <div class="card-list" id="closed-list"></div>
            </details>
          </div>
        </div>
        <div class="side-repos" id="repos"></div>
      </aside>

      <main class="workspace" id="workspace">
        <section class="pane pane-master" id="pane-master"></section>
        <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"></div>
        <section class="pane pane-worker" id="pane-worker"></section>
      </main>

      <footer class="statusbar">
        <div class="sb-group" id="sb-left"></div>
        <div class="sb-group" id="sb-right"></div>
      </footer>
    </div>
    <div class="menu" id="menu" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
