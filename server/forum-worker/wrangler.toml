name = "ai-box-forum"
main = "src/index.ts"
compatibility_date = "2026-08-15"
workers_dev = true
preview_urls = false
# braunanil@gmail.com's Account (personal). Deploy only through the npm scripts (isolated login, see README.md):
# every remote command first checks that the ai-box profile sees this account (scripts/cloudflare.mjs --guard).
account_id = "5c23f99edf8734dce0a1176009f283cf"

[[d1_databases]]
binding = "DB"
database_name = "ai-box-forum"
# Written by `npm run cf:setup` once the database exists.
database_id = "c5737ee6-f3db-4f53-8de2-06840222ecaa"
migrations_dir = "migrations"

# A burst limit per address, on top of the daily quotas kept in D1.
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Secrets, never committed, set by `npm run cf:setup`: ADMIN_TOKEN_HASH (SHA-256 of the moderators' key), IP_SALT.
# For `npm run dev`, put them in .dev.vars (git-ignored).
